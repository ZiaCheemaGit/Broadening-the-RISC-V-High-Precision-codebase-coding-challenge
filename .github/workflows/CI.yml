name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"

jobs:  
  test_pc_one:
    name: CI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: sudo apt install -y  python3 python3-pip

      - name: Install nox
        run: pip install nox

      - name: Perfect moves Test
        run: nox -s test_number_of_moves

      - name: Solution Test
        run: nox -s test_final_state
  
            